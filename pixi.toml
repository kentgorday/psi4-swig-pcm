[workspace]
channels = ["conda-forge"]
name = "psi4-swig-pcm"
platforms = [
    "osx-arm64",
    "linux-64",
    # Only the accelerate environment runs here (see [feature.accelerate]).  A platform that
    # carries a virtual package needs a name of its own.
    { name = "osx-arm64-macos-27-2", platform = "osx-arm64", macos = "27.2" },
]
# Building this package (and depending on it from source, as tautomator does) uses pixi-build,
# still a preview feature in pixi 0.82.
preview = ["pixi-build"]
# pixi-build-python 0.8 speaks build API 5 and up, which pixi accepts from 0.71.
requires-pixi = ">=0.71.0"

# The macOS that source builds (this package, moist) target.  pixi-build takes it from the
# platform's macOS, which on the 27.2 platform is newer than any conda-forge deployment target
# (26.0 at most), so that solve fails without this.  13.0 is what the plain osx-arm64 platform
# gets anyway, so every environment builds the same packages.
[workspace.target.osx-arm64.build-variants]
c_stdlib_version = ["13.0"]

# ------------------------------------------------------------------ the conda package
# Name and version come from pyproject.toml; pixi-build-python runs scikit-build-core,
# which runs CMakeLists.txt.

[package.build]
backend = { name = "pixi-build-python", version = ">=0.8" }
config = { noarch = false, compilers = ["cxx"] }

[package.host-dependencies]
python = "3.13.*"
# The Psi4 the extension is compiled against.  Psi4 run-exports psi4 >=1.11,<1.12 to the
# built package.
psi4 = "1.11.*"
pybind11 = "*"
# psi4/libmints/matrix.h includes Eigen, so the extension compiles against its headers (no
# Eigen code ends up in the binary).  conda-forge's psi4 1.11 is built with Eigen 5.0; keep
# the same major so the headers agree with Psi4's.
eigen = "5.*"
# Only to get through libint2-config.cmake (see CMakeLists.txt); no Boost header is compiled.
libboost-headers = "*"
scikit-build-core = ">=0.11"
cmake = ">=3.19"
ninja = "*"

[package.run-dependencies]
# The same pin as Psi4's run-export, stated in case that export ever changes.
psi4 = "1.11.*"
numpy = "*"
scipy = ">=1.15"

# ------------------------------------------------------------------ development environments

[dependencies]
python = "3.13.*"
psi4 = "1.11.*"
# qcelemental 0.51.3 defines a unit ("J^{-2}") that pint 0.26.2 rejects, which breaks optking.
qcelemental = ">=0.51.4"
# This repository's own package, built by pixi-build and installed editable.
psi4-swig-pcm = { path = "." }
pytest = ">=9.0.3,<10"
mypy = ">=1.20.0,<2"
ruff = ">=0.11,<1"

# BLAS/LAPACK is conda-forge's default (OpenBLAS on both platforms), as in tautomator; not
# Apple's Accelerate, whose dpotrf on the upper triangle (scipy's cholesky(lower=True), which
# cavity.PCMOperator.diagnostics calls) reads and writes outside its matrix for orders of
# about 1450-5500 before macOS 27.2, in both of its LAPACK interfaces (tautomator's README).

# The platforms of every environment but accelerate: all but the macOS 27.2 one.  An
# environment gets the platforms its features have in common, and a feature that names none
# gets them all, so without this each would also be solved for macOS 27.2.
[feature.default-blas]
platforms = ["osx-arm64", "linux-64"]

# Apple's Accelerate instead of OpenBLAS, on osx-arm64 from macOS 27.2, where Apple fixed the
# dpotrf bug above (scipy/scipy#26145), as in tautomator's accelerate environments.  It still
# writes into the lower triangle when it factors the upper one, so there scipy's
# cholesky(lower=True) returns a matrix that is not triangular; diagnostics only asks whether
# it succeeds.  On an older macOS, installing it stops with a virtual-package error.
[feature.accelerate]
platforms = ["osx-arm64-macos-27-2"]

[feature.accelerate.dependencies]
libblas = { version = "*", build = "*_newaccelerate" }

[tasks]
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
typecheck = "mypy src/ tests/"
check = { depends-on = ["lint", "format-check", "typecheck"] }
test = { cmd = "pytest -m 'not slow and not pyscf'", env = { OMP_NUM_THREADS = "4" } }
test-slow = { cmd = "pytest -m 'slow and not pyscf'", env = { OMP_NUM_THREADS = "4" } }

# PySCF 2.11 as the reference implementation.  The PyPI wheel on purpose: conda-forge pyscf
# < 2.13 needs xcfun built against pybind11-abi 4, which cannot share an environment with
# Psi4 1.11 (abi 11).  Import psi4 before pyscf in any process that uses both: the wheel's
# bundled libxc otherwise shadows Psi4's.
[feature.crosscheck.pypi-dependencies]
pyscf = "==2.11.0"

[feature.crosscheck.dependencies]
# PySCF 2.11's lib.einsum (>= 3 operands) breaks on numpy 2.4+.
numpy = "2.3.*"

[feature.crosscheck.tasks]
crosscheck = { cmd = "pytest -m pyscf", env = { OMP_NUM_THREADS = "4" } }

# ------------------------------------------------------------------ moist (packages/moist)
# moist (https://github.com/lukaswittmann/moist), built from source by pixi-build from the
# recipe in packages/moist.  tautomator's PySCF environment takes moist from that recipe too;
# this environment builds it and checks the build (tests/test_moist_build.py), and runs the
# moist host prototype (moist_host.py, tests/test_moist.py).  The first
# `pixi install -e moist` compiles moist.

[feature.moist.dependencies]
moist = { path = "packages/moist" }

[feature.moist.tasks]
test-moist = { cmd = "pytest -m 'moist and not slow and not pyscf'", env = { OMP_NUM_THREADS = "4" } }
test-moist-slow = { cmd = "pytest -m 'moist and slow and not pyscf'", env = { OMP_NUM_THREADS = "4" } }

[feature.moist-crosscheck.tasks]
crosscheck-moist = { cmd = "pytest -m 'moist and pyscf'", env = { OMP_NUM_THREADS = "4" } }

[environments]
default = ["default-blas"]
crosscheck = ["crosscheck", "default-blas"]
moist = ["moist", "default-blas"]
# moist's own PySCF host as the reference for this Psi4 host
moist-crosscheck = ["moist", "crosscheck", "moist-crosscheck", "default-blas"]
# The default environment on Accelerate (osx-arm64, macOS 27.2 and later)
accelerate = ["accelerate"]
