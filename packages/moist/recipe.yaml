context:
  version: "1.1.0a1"
  tag: v1.1.0-alpha.1

package:
  name: moist
  version: ${{ version }}

# moist and the Fortran libraries its meson wraps (subprojects/*.wrap) name, at the
# revisions those wraps pin for this release.  Fetched here rather than by meson, so the
# build itself needs no network and every source is pinned in this file; moving to a new
# moist release means copying its wraps' revisions too.
source:
  - git: https://github.com/lukaswittmann/moist.git
    tag: ${{ tag }}
    patches:
      # a missing #include in moist's copy of FINUFFT; clang 23's libc++ needs it
      - patches/0001-finufft-pswf-include-algorithm.patch
      # host functionals on the surface: the reverse contractions moist runs for its own models
      - patches/0002-export-surface-adjoint-contractions.patch
      # the PCM's apparent surface charges q (and qsym), readable after an evaluation
      - patches/0003-publish-pcm-surface-charges.patch
  - git: https://github.com/chselz/fclap.git
    tag: v0.1.0
    target_directory: subprojects/fclap
  - git: https://github.com/toml-f/jonquil.git
    tag: v0.3.2
    target_directory: subprojects/jonquil
  - git: https://github.com/grimme-lab/mctc-lib.git
    tag: v0.6.1
    target_directory: subprojects/mctc-lib
  - git: https://github.com/grimme-lab/mstore.git
    rev: 10a3437b3634dd4464557580ae36c1ed72535f6c
    target_directory: subprojects/mstore
  - git: https://github.com/fortran-lang/test-drive.git
    rev: 791484a79a24cbc00be6f74e53c6e030cb75efe2
    target_directory: subprojects/test-drive
  - git: https://github.com/toml-f/toml-f.git
    tag: v0.5.1
    target_directory: subprojects/toml-f

build:
  number: 2
  # The subprojects are built static, linked into moist's Python extension, and not
  # installed (--skip-subprojects), so they cannot clash with conda-forge packages of the
  # same libraries (mctc-lib, toml-f) in an environment.
  script:
    - meson setup builddir --prefix="$PREFIX" --libdir=lib --buildtype=release
      --default-library=static --wrap-mode=nodownload
      -Dpython=true -Dpython_version="$PYTHON" -Dlapack=netlib
      -Ddev_tests=false -Ddocs=false
    - meson compile -C builddir
    - meson install -C builddir --skip-subprojects
    # The static library, headers and Fortran modules are for linking against moist
    # (46 MB), which nothing here does; the Python package and the moist CLI stay.
    - rm -rf "$PREFIX/lib/libmoist.a" "$PREFIX/lib/pkgconfig/moist.pc"
      "$PREFIX/include/moist" "$PREFIX/include/moist.h"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - meson >=1.2.3,!=1.8.0
    - ninja
    - pkg-config
    - git
  host:
    # The extension is built for one Python: the one this repository and tautomator use.
    - python 3.13.*
    - cffi
    - setuptools
    # The generic BLAS/LAPACK interfaces (-llapack -lblas), so moist uses whichever
    # implementation the environment selects, as Psi4, PySCF and numpy do: OpenBLAS here and
    # in tautomator on osx-arm64, MKL in tautomator on linux-64.  Built against the netlib
    # variants, as conda-forge's own pinning does: in the OpenBLAS variants liblapack and
    # libblas are links to libopenblas, so the extension would record libopenblas, and fail
    # to load, or pick up a system OpenBLAS, beside another implementation (MKL, Accelerate).
    # tests/test_moist_build.py checks both.
    - libblas * *netlib
    - liblapack * *netlib
    # Psi4 and PySCF run on LLVM's OpenMP on macOS.  moist must load the same runtime, not a
    # second copy: two OpenMP runtimes in one process abort or oversubscribe.
    - if: osx
      then: llvm-openmp
  run:
    - python
    - cffi
    - numpy

tests:
  - python:
      imports:
        - moist
      pip_check: false
  - script:
      - python -c "import moist; print(moist.get_version_string())"

about:
  homepage: https://github.com/lukaswittmann/moist
  license: MPL-2.0
  license_file: LICENSE
  summary: The Modular and Open-source Implicit Solvation Toolkit (Fortran, C and Python APIs)
